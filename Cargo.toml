[package]
name = "mergesort"
version = "2.0.1"
edition = "2024"
description = "MergeSort Pro — high-performance external merge sort for files larger than RAM (numeric, string, CSV)"
license = "MIT"
keywords = ["sort", "external-sort", "big-data", "csv", "cli"]
categories = ["command-line-utilities", "data-structures"]

[[bin]]
name = "mergesort"
path = "src/main.rs"

[[bin]]
name = "gen"
path = "src/gen.rs"

[dependencies]
indicatif = "0.18.6"
rayon = "1.10"
sysinfo = "0.39.6"
serde_json = "1.0"
flate2 = "1.0"
zip = "2.2"
calamine = "0.24"
rust_xlsxwriter = "0.90"

[dev-dependencies]
proptest = "1.11.0"
